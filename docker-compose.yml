# TalentPulse â€” setup satu perintah untuk pengembangan dan demo lokal.
#
#   cp .env.example .env
#   docker compose up --build
#   docker compose exec backend python -m app.seed --reset
#
services:
  db:
    image: postgres:16-alpine
    container_name: talentpulse-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentpulse}
      POSTGRES_DB: ${POSTGRES_DB:-talentpulse}
    ports:
      # Hanya dari laptop ini (127.0.0.1); tidak terbuka ke jaringan/Wi-Fi.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - talentpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentpulse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/api
    container_name: talentpulse-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-talentpulse}:${POSTGRES_PASSWORD:-talentpulse}@db:5432/${POSTGRES_DB:-talentpulse}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      AUTHOR_HASH_KEY: ${AUTHOR_HASH_KEY:-dev-only-insecure-author-key-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE:-demo}
      # Token hanya dibaca di server; tidak pernah dikirim ke browser.
      X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
      X_API_PROVIDER: ${X_API_PROVIDER:-official}
      TWITTERAPI_IO_KEY: ${TWITTERAPI_IO_KEY:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-TalentPulse123!}
      ENABLE_SYSTEM_OPS: ${ENABLE_SYSTEM_OPS:-false}
      # Aturan lonjakan isu mingguan (Tujuan 3).
      SPIKE_MIN_POSTS: ${SPIKE_MIN_POSTS:-10}
      SPIKE_MIN_INCREASE_PERCENT: ${SPIKE_MIN_INCREASE_PERCENT:-50}
      SPIKE_BASELINE_WEEKS: ${SPIKE_BASELINE_WEEKS:-4}
      # Retensi data nyata: tidak relevan dihapus 14 hari setelah masuk, relevan tepat 90 hari.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_RAW_DAYS: ${RETENTION_RAW_DAYS:-90}
      RETENTION_IRRELEVANT_DAYS: ${RETENTION_IRRELEVANT_DAYS:-14}
      RETENTION_RELEVANCE_MIN_SCORE: ${RETENTION_RELEVANCE_MIN_SCORE:-0}
      # Balasan yang ikut diambil saat menarik data live.
      REPLY_FETCH_ENABLED: ${REPLY_FETCH_ENABLED:-true}
      REPLY_FETCH_MAX_PARENTS: ${REPLY_FETCH_MAX_PARENTS:-5}
      REPLY_FETCH_MAX_PER_PARENT: ${REPLY_FETCH_MAX_PER_PARENT:-20}
    ports:
      # Browser memakai /api lewat frontend; port ini hanya untuk debug lokal.
      - "127.0.0.1:${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        API_PROXY_TARGET: http://backend:8000
    container_name: talentpulse-web
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  talentpulse-db:
